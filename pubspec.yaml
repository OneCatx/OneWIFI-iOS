name: onewifi_android
description: "OneWIFI Android client for the WEB service."
publish_to: 'none'
version: 0.1.28+33

environment:
  sdk: ^3.12.2

dependencies:
  crypto: 3.0.7
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.0.0
  http: 1.6.0
  provider: 6.1.5+1
  shared_preferences: 2.5.5
  url_launcher: 6.3.2
  flutter_svg: 2.2.3
  intl: ^0.20.2

dev_dependencies:
  fake_async: 1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/flags/
    - assets/esim/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
