# Windows JDK 17/21 default WEPoll + Unix-domain Pipe can fail with
# "Unable to establish loopback connection" / connect EINVAL. Force the
# classic selector so Gradle's single-use daemon can start.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.nio.channels.spi.SelectorProvider=sun.nio.ch.WindowsSelectorProvider -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# AGP 9.0.1's advertised max is 36; compileSdk 37 is required by
# flutter_secure_storage and is present as platforms/android-37.
android.suppressUnsupportedCompileSdk=37
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
